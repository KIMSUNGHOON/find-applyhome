<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청약홈 미계약 세대 스캐너</title>
<style>
  :root { color-scheme: light dark; --line:#d6d9de; --dim:#6b7280; --empty:#e8590c; --info:#adb5bd; --err:#c92a2a;
          --special:#5c7cfa; --general:#adb5bd; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         margin: 0; padding: 16px 20px; max-width: none; line-height: 1.5; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  legend { font-size: 13px; color: var(--dim); padding: 0 6px; }
  input, select, button { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; }
  button { cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
  #results { margin-top: 12px; max-height: 260px; overflow-y: auto; }
  #results label { display: block; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #results .meta { color: var(--dim); font-size: 12px; margin-left: 6px; }
  #notice { background: #fff4e6; border: 1px solid #ffd8a8; color: #8a5a1b; padding: 10px 12px;
            border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  @media (prefers-color-scheme: dark) { #notice { background:#3a2c17; border-color:#6b5220; color:#f0c992; } }
  progress { width: 320px; vertical-align: middle; }
  .hide { display: none; }
  .status { color: var(--dim); font-size: 13px; }

  /* 동을 가로로 흘려 배치한다. 장위처럼 동이 23개인 단지에서 세로 스크롤이 과도해진다. */
  #grids { display: flex; flex-wrap: wrap; gap: 20px 26px; align-items: flex-start; }
  .dong { margin: 0; }
  .dong h3 { font-size: 15px; margin: 0 0 8px; }
  table.grid { border-collapse: collapse; font-size: 11px; }
  table.grid th { color: var(--dim); font-weight: 400; padding: 2px 5px; }
  table.grid th.type { font-size: 10px; color: var(--dim); padding: 0 2px 3px; }
  table.grid td { padding: 1px; }
  /* 색 네 가지로 나눈다 — 특별공급(파랑) / 일반공급(회색) / 미계약(주황) / 실패(빨강).
     미계약 주황이 가장 눈에 띄어야 한다. 이 도구를 쓰는 이유가 그것이다.
     글자(특·일)는 색과 겹치지만 남겨 둔다. 색맹 대응이자, 캡처를 공유할 때 설명이 된다. */
  .cell { width: 30px; height: 24px; border: 1px solid var(--line); border-radius: 3px;
          background: transparent; cursor: pointer; font-size: 11px; color: transparent;
          overflow: hidden; padding: 0; line-height: 1; }
  .cell.info  { background: var(--info); color: #fff; }   /* 공급유형을 못 읽었을 때의 기본값 */
  .cell.info.supply-s { background: var(--special); }
  .cell.info.supply-g { background: var(--general); }
  .cell.empty { background: var(--empty); color: transparent; }
  .cell.error { background: var(--err); color: transparent; }
  .flat { display: flex; flex-wrap: wrap; gap: 3px; }
  .flat .cell { width: 52px; color: inherit; overflow: visible; }
  .flat .cell.info, .flat .cell.empty, .flat .cell.error { color: #fff; }
  .legend { font-size: 12px; color: var(--dim); margin-top: 8px; flex-basis: 100%; }
  .swatch { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
            vertical-align: -1px; margin: 0 3px 0 10px; }
  /* 상세는 화면 아래에 붙되, 격자를 가리지 않도록 여러 열로 압축한다. */
  #detail:not(:empty) { position: sticky; bottom: 0; background: Canvas; font-size: 13px;
            border-top: 1px solid var(--line); padding: 8px 0; max-height: 34vh; overflow-y: auto; }
  #detail .fields { display: grid; gap: 1px 20px; margin-top: 4px;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  #detail .fields div span { color: var(--dim); display: inline-block; min-width: 108px; }
  table.list { border-collapse: collapse; font-size: 13px; margin-top: 8px;
               width: 100%; max-width: 820px; }
  table.list th, table.list td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.list th { color: var(--dim); font-weight: 400; }

  #summary { margin: 14px 0 6px; }
  #summary h3 { font-size: 15px; margin: 0 0 6px; }
  table.summary { border-collapse: collapse; font-size: 13px; }
  table.summary th, table.summary td { padding: 4px 12px 4px 0; text-align: right; }
  table.summary th { color: var(--dim); font-weight: 400; }
  table.summary td:first-child, table.summary th:first-child { text-align: left; font-weight: 600; }
  table.summary tr.total td { border-top: 1px solid var(--line); font-weight: 600; }
  .warn { background: #fff4e6; border: 1px solid #ffd8a8; color: #8a5a1b;
          padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
  @media (prefers-color-scheme: dark) { .warn { background:#3a2c17; border-color:#6b5220; color:#f0c992; } }
  .muted { color: var(--dim); font-size: 12px; font-weight: 400; }
</style>
</head>
<body>

<h1>청약홈 미계약 세대 스캐너</h1>
<div class="sub">단지를 고르면 전 동·전 호의 분양권 정보 등록 여부를 한 번에 확인합니다.</div>

<fieldset>
  <legend>1. 단지 찾기</legend>
  <form id="search-form">
    <input id="q" placeholder="단지명 (예: 상봉 센트럴)" size="28" autofocus>
    <select id="area">
      <option value="">시도 전체</option>
    </select>
    <button type="submit">검색</button>
  </form>
  <div id="results"></div>
  <div id="search-status" class="status"></div>
  <button id="more" class="hide" type="button">더 보기</button>
</fieldset>

<fieldset>
  <legend>2. 스캔</legend>
  <button id="scan-button" disabled>전체 스캔</button>
  <button id="stop-button" class="hide">중단</button>
  <span id="progress" class="status"></span>
</fieldset>

<div id="notice" class="hide">
  이 결과는 청약홈에 분양권 정보가 등록되지 않은 세대입니다.
  미계약·부적격 세대일 가능성이 높으나, 사업주체의 등록 지연일 수도 있으므로 참고용으로만 활용하세요.
</div>

<div id="summary"></div>
<div id="grids"></div>
<div id="empty-list"></div>
<div id="detail"></div>

<script>
const AREAS = ["강원","경기","경남","경북","광주","대구","대전","부산","서울","세종",
               "울산","인천","전남","전북","제주","충남","충북"];

const el = (id) => document.getElementById(id);
const state = {
  complex: null, meta: null, units: new Map(), token: null, source: null,
  search: { name: "", area: "", page: 1, loaded: 0, total: 0 },
};

// 주택형 "084.8422A" → 표기 "84A", 전용면적 "84.8422".
// grid.py 의 short_type / net_area 와 같은 규칙이다. 한쪽만 고치면 화면 표기가 어긋난다.
function shortType(houseType) {
  const m = /^0*(\d+)\.\d+(.*)$/.exec(houseType || "");
  return m ? m[1] + m[2] : (houseType || "");
}

function netArea(houseType) {
  const m = /^0*(\d+\.\d+)/.exec(houseType || "");
  return m ? m[1] : "";
}

function fmtArea(value) {
  const n = parseFloat(value);
  return isNaN(n) ? "" : n.toFixed(2) + "㎡";
}

AREAS.forEach((name) => {
  const option = document.createElement("option");
  option.value = option.textContent = name;
  el("area").append(option);
});

el("search-form").addEventListener("submit", (event) => {
  event.preventDefault();
  state.search = {
    name: el("q").value.trim(), area: el("area").value, page: 1, loaded: 0, total: 0,
  };
  el("results").innerHTML = "";
  el("more").classList.add("hide");
  loadPage();
});

el("more").addEventListener("click", () => {
  state.search.page += 1;
  loadPage();
});

async function loadPage() {
  const { name, area, page } = state.search;
  el("search-status").textContent = "검색 중…";
  el("more").disabled = true;
  try {
    const params = new URLSearchParams({ name, area, page: String(page) });
    const response = await fetch("/api/search?" + params);
    const body = await response.json();
    if (!response.ok) throw new Error(body.message || "검색 실패");
    renderResults(body);
  } catch (error) {
    el("search-status").textContent = "검색에 실패했습니다: " + error.message;
  } finally {
    el("more").disabled = false;
  }
}

function renderResults(body) {
  state.search.total = body.total;
  state.search.loaded += body.complexes.length;

  if (!state.search.loaded) {
    el("search-status").textContent = "검색 결과가 없습니다.";
    el("more").classList.add("hide");
    return;
  }
  el("search-status").textContent = `${state.search.loaded}건 표시 (전체 ${body.total}건)`;
  el("more").classList.toggle("hide", state.search.loaded >= body.total);

  body.complexes.forEach((item) => {
    const label = document.createElement("label");
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "complex";
    radio.addEventListener("change", () => {
      state.complex = item;
      el("scan-button").disabled = false;
    });
    label.append(radio, " " + item.name);
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `공고 ${item.notice_date} · 당첨발표 ${item.winner_date} · ${item.house_manage_no}`;
    label.append(meta);
    el("results").append(label);
  });
}

el("scan-button").addEventListener("click", () => {
  if (!state.complex) return;
  state.meta = null;
  state.units = new Map();
  state.token = null;
  el("grids").innerHTML = "";
  el("summary").innerHTML = "";
  el("empty-list").innerHTML = "";
  el("detail").innerHTML = "";
  el("notice").classList.add("hide");
  el("scan-button").disabled = true;
  el("stop-button").classList.remove("hide");

  const params = new URLSearchParams({
    hm: state.complex.house_manage_no,
    pb: state.complex.pblanc_no,
  });
  const source = new EventSource("/api/scan?" + params);
  state.source = source;

  source.addEventListener("meta", (event) => {
    state.meta = JSON.parse(event.data);
    el("progress").textContent = `0 / ${state.meta.total}`;
    onMeta(state.meta);
  });

  source.addEventListener("unit", (event) => {
    const unit = JSON.parse(event.data);
    state.units.set(unit.dong + "-" + unit.ho, unit);
    onUnit(unit);
    el("progress").textContent = `${state.units.size} / ${state.meta.total}`;
  });

  source.addEventListener("done", (event) => {
    const summary = JSON.parse(event.data);
    state.token = summary.token;
    el("progress").textContent =
      `완료 · ${summary.total}세대 중 정보없음 ${summary.empty}건` +
      (summary.error ? ` · 실패 ${summary.error}건` : "") +
      ` (${summary.elapsed}초)`;
    finishScan();
    onDone(summary);
  });

  source.addEventListener("error", (event) => {
    if (event.data) {
      const payload = JSON.parse(event.data);
      el("progress").textContent = payload.message;
    } else if (state.units.size === 0) {
      el("progress").textContent = "서버 연결이 끊겼습니다.";
    }
    finishScan();
  });
});

el("stop-button").addEventListener("click", () => {
  el("progress").textContent = `중단됨 · ${state.units.size}세대까지 조회`;
  finishScan();
});

function finishScan() {
  if (state.source) { state.source.close(); state.source = null; }
  el("scan-button").disabled = false;
  el("stop-button").classList.add("hide");
}

function cellId(dong, ho) { return `c-${dong}-${ho}`; }

function makeCell(dong, ho) {
  const button = document.createElement("button");
  button.className = "cell";
  button.id = cellId(dong, ho);
  button.title = `${dong}동 ${ho}호`;
  button.addEventListener("click", () => showDetail(dong, ho));
  return button;
}

function onMeta(meta) {
  el("notice").classList.remove("hide");
  const container = el("grids");
  meta.dongs.forEach((dong) => {
    const box = document.createElement("div");
    box.className = "dong";
    const title = document.createElement("h3");
    title.textContent = `${dong.name}동 · ${dong.hos.length}세대`;
    box.append(title);
    box.append(dong.grid ? buildGridTable(dong) : buildFlatList(dong));
    container.append(box);
  });
}

function buildGridTable(dong) {
  const table = document.createElement("table");
  table.className = "grid";
  const head = table.insertRow();
  head.append(document.createElement("th"));   // 층 라벨 칸 자리
  dong.grid.lines.forEach((line) => {
    const th = document.createElement("th");
    th.textContent = line;
    head.append(th);
  });

  // 타입 행. 스캔이 끝나야 값이 차므로 자리만 만들어 두고 refreshTypeHeaders 가 채운다.
  const typeRow = table.insertRow();
  typeRow.append(document.createElement("th"));
  dong.grid.lines.forEach((line) => {
    const th = document.createElement("th");
    th.className = "type";
    th.dataset.dong = dong.name;
    th.dataset.line = line;
    typeRow.append(th);
  });

  const byFloor = new Map();
  Object.entries(dong.grid.cells).forEach(([ho, [floor, line]]) => {
    if (!byFloor.has(floor)) byFloor.set(floor, new Map());
    byFloor.get(floor).set(line, ho);
  });
  dong.grid.floors.forEach((floor) => {
    const row = table.insertRow();
    const th = document.createElement("th");
    th.textContent = floor + "F";
    row.append(th);
    dong.grid.lines.forEach((line) => {
      const cell = row.insertCell();
      const ho = byFloor.get(floor)?.get(line);
      if (ho) cell.append(makeCell(dong.name, ho));
    });
  });
  return table;
}

function refreshTypeHeaders() {
  const cache = new Map();
  document.querySelectorAll("th.type").forEach((th) => {
    const dong = th.dataset.dong;
    if (!cache.has(dong)) cache.set(dong, lineTypes(dong));
    const type = cache.get(dong).get(th.dataset.line);
    th.textContent = type ? (type === "혼합" ? "혼합" : shortType(type)) : "";
  });
}

function buildFlatList(dong) {
  const box = document.createElement("div");
  box.className = "flat";
  dong.hos.forEach((ho) => box.append(makeCell(dong.name, ho)));
  return box;
}

const SUPPLY_MARK = { "특별공급": "특", "일반공급": "일" };
const SUPPLY_CLASS = { "특별공급": "supply-s", "일반공급": "supply-g" };

function onUnit(unit) {
  const cell = document.getElementById(cellId(unit.dong, unit.ho));
  if (!cell) return;
  cell.classList.remove("supply-s", "supply-g");  // 재시도로 값이 바뀔 수 있다
  cell.classList.add(unit.status);

  const type = unit.fields["주택형"] || "";
  const supply = unit.fields["공급유형"] || "";
  // 미계약·실패 세대에는 공급유형이 없다. 청약홈이 값을 주지 않으므로 글자와 색을 비운다.
  cell.textContent = SUPPLY_MARK[supply] || "";
  if (SUPPLY_CLASS[supply]) cell.classList.add(SUPPLY_CLASS[supply]);
  cell.title =
    `${unit.dong}동 ${unit.ho}호` +
    (type ? ` · ${shortType(type)}` : "") +
    (supply ? ` · ${supply}` : "");
}

// 라인(호수 끝 두 자리)마다 주택형을 모은다. 한 라인에 두 타입이 섞이면 "혼합".
// 정보있음 세대의 주택형에서 역산하므로 스캔이 진행되며 채워진다.
function lineTypes(dongName) {
  const found = new Map();
  for (const unit of state.units.values()) {
    if (unit.dong !== dongName || unit.status !== "info") continue;
    const type = unit.fields["주택형"];
    if (!type || unit.ho.length < 3) continue;
    const line = unit.ho.slice(-2);
    const seen = found.get(line);
    if (seen === undefined) found.set(line, type);
    else if (seen !== type) found.set(line, "혼합");
  }
  return found;
}

// 세대를 타입별로 모은다. 미계약 세대는 주택형이 없으므로 같은 라인의 타입을 빌려 채운다.
function tallyByType() {
  const byDong = new Map();
  const tally = new Map();   // 주택형 → {scanned, empty}
  for (const unit of state.units.values()) {
    if (!byDong.has(unit.dong)) byDong.set(unit.dong, lineTypes(unit.dong));
    const type =
      unit.fields["주택형"] ||
      (unit.ho.length >= 3 ? byDong.get(unit.dong).get(unit.ho.slice(-2)) : "");
    if (!type || type === "혼합") continue;
    if (!tally.has(type)) tally.set(type, { scanned: 0, empty: 0 });
    const row = tally.get(type);
    row.scanned += 1;
    if (unit.status === "empty") row.empty += 1;
  }
  return tally;
}

function onDone(summary) {
  refreshTypeHeaders();
  renderSummary();
  renderLegend(summary);
  renderEmptyList();
  renderActions(summary);
}

function renderSummary() {
  const tally = tallyByType();
  if (!tally.size) { el("summary").innerHTML = ""; return; }

  const supply = state.meta?.supply || null;
  const byType = new Map((supply || []).map((s) => [s.type, s]));

  // 공고에는 있는데 스캔에 안 잡힌 타입도 표에 남긴다
  const types = new Set([...tally.keys(), ...byType.keys()]);
  const sorted = [...types].sort((a, b) => {
    const d = parseFloat(netArea(a)) - parseFloat(netArea(b));
    return d !== 0 ? d : shortType(a).localeCompare(shortType(b));
  });

  const warnings = [];
  const rows = sorted.map((type) => {
    const t = tally.get(type) || { scanned: 0, empty: 0 };
    const s = byType.get(type);
    if (s && s.total !== t.scanned) {
      warnings.push(
        `${shortType(type)} 타입: 공고 ${s.total}세대 / 스캔 ${t.scanned}세대`
      );
    }
    const base = s ? s.total : t.scanned;
    const rate = base ? ((t.empty / base) * 100).toFixed(1) + "%" : "-";
    // 공고에 있는 타입은 서버가 계산해 보낸 값을, 스캔에서만 나온 타입은 여기서 계산한다
    const label = s ? s.short : shortType(type);
    const net = s ? s.net_area : netArea(type);
    return `<tr>
      <td>${label}</td>
      <td>${fmtArea(net)}</td>
      <td>${s ? fmtArea(s.area) : "-"}</td>
      <td>${s ? `${s.total} <span class="muted">(${s.general} / ${s.special})</span>` : t.scanned}</td>
      <td>${t.empty}</td>
      <td>${rate}</td>
    </tr>`;
  });

  const totalEmpty = [...tally.values()].reduce((sum, t) => sum + t.empty, 0);
  const totalScanned = [...tally.values()].reduce((sum, t) => sum + t.scanned, 0);
  const totalSupply = supply ? supply.reduce((sum, s) => sum + s.total, 0) : totalScanned;
  const totalGeneral = supply ? supply.reduce((sum, s) => sum + s.general, 0) : 0;
  const totalSpecial = supply ? supply.reduce((sum, s) => sum + s.special, 0) : 0;
  const totalRate = totalSupply ? ((totalEmpty / totalSupply) * 100).toFixed(1) + "%" : "-";

  const warnHtml = warnings.length
    ? `<div class="warn">⚠ ${warnings.join(" · ")} — 라인과 타입의 대응이 단순하지 않은 단지일 수 있어
       타입별 집계가 정확하지 않을 수 있습니다.</div>`
    : "";

  el("summary").innerHTML =
    `<h3>타입별 현황 <span class="muted">${supply ? "공고 기준" : "공고 대조 불가 · 스캔 기준"}</span></h3>` +
    warnHtml +
    `<table class="summary"><thead><tr>
       <th>타입</th><th>전용</th><th>공급</th><th>${supply ? "공고(일반/특별)" : "스캔"}</th>
       <th>미계약 추정</th><th>비율</th>
     </tr></thead><tbody>${rows.join("")}` +
    `<tr class="total"><td>합계</td><td></td><td></td>` +
    `<td>${totalSupply}${supply ? ` <span class="muted">(${totalGeneral} / ${totalSpecial})</span>` : ""}</td>` +
    `<td>${totalEmpty}</td><td>${totalRate}</td></tr></tbody></table>`;
}

function renderActions(summary) {
  if (state.token) {
    el("empty-list").insertAdjacentHTML(
      "afterbegin",
      `<p><a href="/api/export?token=${state.token}" download>CSV로 내려받기</a></p>`
    );
  }
  if (summary.error) renderRetry(summary);
}

function renderRetry(summary) {
  const button = document.createElement("button");
  button.textContent = `조회 실패 ${summary.error}건 다시 시도`;
  button.addEventListener("click", async () => {
    button.disabled = true;
    button.textContent = "다시 시도하는 중…";
    const failed = [...state.units.values()].filter((unit) => unit.status === "error");
    for (const unit of failed) {
      const params = new URLSearchParams({
        hm: state.complex.house_manage_no,
        pb: state.complex.pblanc_no,
        dong: unit.dong,
        ho: unit.ho,
        token: state.token || "",
      });
      try {
        const fresh = await (await fetch("/api/unit?" + params)).json();
        state.units.set(fresh.dong + "-" + fresh.ho, fresh);
        const cell = document.getElementById(cellId(fresh.dong, fresh.ho));
        if (cell) {
          cell.classList.remove("error", "info", "empty");
          cell.classList.add(fresh.status);
        }
      } catch (error) {
        // 이 세대는 그대로 두고 다음으로 넘어간다
      }
    }
    const tally = { info: 0, empty: 0, error: 0 };
    state.units.forEach((unit) => { tally[unit.status] = (tally[unit.status] || 0) + 1; });
    const updated = { ...summary, ...tally };
    renderLegend(updated);
    renderEmptyList();
    renderActions(updated);
  });
  el("empty-list").prepend(button);
}

function renderLegend(summary) {
  document.querySelectorAll(".legend").forEach((node) => node.remove());

  let special = 0, general = 0, unknown = 0;
  state.units.forEach((unit) => {
    if (unit.status !== "info") return;
    const supply = unit.fields["공급유형"];
    if (supply === "특별공급") special += 1;
    else if (supply === "일반공급") general += 1;
    else unknown += 1;
  });

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML =
    `<span class="swatch" style="background:var(--special)"></span>특별공급 ${special}` +
    `<span class="swatch" style="background:var(--general)"></span>일반공급 ${general}` +
    (unknown ? `<span class="swatch" style="background:var(--info)"></span>유형미상 ${unknown}` : "") +
    `<span class="swatch" style="background:var(--empty)"></span>정보없음 ${summary.empty}` +
    (summary.error ? `<span class="swatch" style="background:var(--err)"></span>조회실패 ${summary.error}` : "") +
    `<span style="margin-left:14px">빈칸 = 청약홈 미등록 (조합원·임대 등 일반분양 외 물량)</span>` +
    `<span style="margin-left:14px">색과 글자(특·일)는 그 세대 당첨자의 청약 유형입니다</span>`;
  el("grids").append(legend);
}

// 정보없음 응답에는 값이 하나도 실려 오지 않는다 (라벨만 있고 주택형·공급유형 칸이 비어 있다).
// 그래서 같은 동·같은 라인의 정보있음 세대에서 타입을 빌려와 참고값으로 보여준다.
function renderEmptyList() {
  const empties = [...state.units.values()]
    .filter((unit) => unit.status === "empty")
    .sort((a, b) => a.dong.localeCompare(b.dong) || Number(a.ho) - Number(b.ho));

  if (!empties.length) {
    el("empty-list").innerHTML = "<p>정보없음 세대가 없습니다.</p>";
    return;
  }
  const byDong = new Map();
  const rows = empties
    .map((unit) => {
      if (!byDong.has(unit.dong)) byDong.set(unit.dong, lineTypes(unit.dong));
      const type = unit.ho.length >= 3 ? byDong.get(unit.dong).get(unit.ho.slice(-2)) || "" : "";
      const shown = type && type !== "혼합" ? shortType(type) : type;
      return `<tr><td>${unit.dong}</td><td>${unit.ho}</td><td>${shown}</td>` +
             `<td>${type && type !== "혼합" ? fmtArea(netArea(type)) : ""}</td></tr>`;
    })
    .join("");
  el("empty-list").innerHTML =
    `<h3>정보없음 ${empties.length}세대</h3>` +
    `<table class="list"><thead><tr><th>동</th><th>호</th><th>타입(참고)</th><th>전용</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

function showDetail(dong, ho) {
  const unit = state.units.get(dong + "-" + ho);
  if (!unit) return;
  if (unit.status !== "info") {
    if (unit.status !== "empty") {
      el("detail").innerHTML = `<b>${dong}동 ${ho}호</b> — 조회 실패`;
      return;
    }
    const type = unit.ho.length >= 3 ? lineTypes(dong).get(ho.slice(-2)) || "" : "";
    const s = (state.meta?.supply || []).find((x) => x.type === type);
    const parts = [];
    if (type && type !== "혼합") {
      parts.push(`${shortType(type)} · 전용 ${fmtArea(netArea(type))}`);
    }
    if (s) parts.push(`공고 ${s.total}세대 (일반 ${s.general} / 특별 ${s.special})`);
    el("detail").innerHTML =
      `<b>${dong}동 ${ho}호</b> — 정보없음 (미계약·부적격 추정)` +
      (parts.length ? `<div class="muted">${parts.join(" · ")}</div>` : "");
    return;
  }
  const rows = Object.entries(unit.fields)
    .map(([key, value]) => `<div><span>${key}</span>${value || "-"}</div>`)
    .join("");
  el("detail").innerHTML = `<b>${dong}동 ${ho}호</b><div class="fields">${rows}</div>`;
}
</script>
</body>
</html>
