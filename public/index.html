<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청약홈 미계약 세대 스캐너</title>
<style>
  :root {
    --canvas:#000000; --surface-soft:#0d0d0d; --surface-card:#1a1a1a;
    --surface-elev:#262626; --cell-idle:#141414; --hairline:#3c3c3c;
    --on-dark:#ffffff; --body-strong:#e6e6e6; --body:#bbbbbb; --muted:#7e7e7e;
    --m-blue-light:#0066b1; --m-blue-dark:#1c69d4; --m-red:#e22718;
    --data-empty:#e22718; --data-special:#1c69d4; --data-general:#6e6e6e; --data-error:#f4b400;
    --band:96px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Apple SD Gothic Neo", sans-serif;
    font-weight: 300; font-size: 16px; line-height: 1.5;
  }

  /* M 삼색 — 브랜드 마커 전용. 버튼이나 표면 채우기로 쓰지 않는다. */
  .m-stripe {
    height: 4px;
    background: linear-gradient(90deg,
      var(--m-blue-light) 0 33.33%, var(--m-blue-dark) 33.33% 66.66%, var(--m-red) 66.66% 100%);
  }

  .wrap { padding: 0 40px; }
  .band { padding-top: var(--band); }
  .band:first-of-type { padding-top: 56px; }

  h1 { margin: 0; font-size: 56px; font-weight: 700; line-height: 1.0;
       letter-spacing: -0.5px; color: var(--on-dark); }
  h2 { margin: 0 0 24px; font-size: 32px; font-weight: 700; line-height: 1.15;
       letter-spacing: -0.3px; color: var(--on-dark); }
  h3 { margin: 0 0 12px; font-size: 20px; font-weight: 700; color: var(--on-dark); }
  .lead { margin: 16px 0 0; font-size: 16px; font-weight: 300; color: var(--body); max-width: 720px; }

  /* 영문·숫자 라벨 전용. 한글에는 대문자가 없어 굵기와 자간으로 처리한다. */
  .label { font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
           text-transform: uppercase; color: var(--on-dark); }
  .step { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
  .step-no { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); }
  .step-name { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: var(--on-dark); }
  .caption { font-size: 12px; font-weight: 400; letter-spacing: 0.5px; color: var(--muted); }
  .status { font-size: 14px; font-weight: 300; color: var(--body); }
  .hide { display: none !important; }

  .btn {
    appearance: none; background: transparent; color: var(--on-dark);
    border: 1px solid var(--on-dark); border-radius: 0;
    height: 48px; padding: 0 32px;
    font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
  }
  .btn[disabled] { opacity: .35; cursor: default; }

  .input, select.input {
    appearance: none; background: var(--surface-card); color: var(--on-dark);
    border: 1px solid var(--hairline); border-radius: 0;
    height: 48px; padding: 0 16px;
    font-family: inherit; font-size: 16px; font-weight: 300;
  }
  .input:focus { outline: none; border-color: var(--on-dark); }
  select.input { padding-right: 32px; }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

  /* 검색 결과 — category-tab. 라디오는 숨기고 좌측 2px 바로 선택을 나타낸다. */
  #results { margin-top: 24px; max-height: 300px; overflow-y: auto; }
  .pick { display: block; padding: 12px 0 12px 14px; border-left: 2px solid transparent;
          border-bottom: 1px solid var(--hairline); color: var(--body); cursor: pointer; }
  .pick input { position: absolute; opacity: 0; pointer-events: none; }
  .pick.on { border-left-color: var(--on-dark); color: var(--on-dark); }
  .pick-name { font-size: 16px; font-weight: 700; }
  .pick-meta { display: block; margin-top: 2px; font-size: 12px; font-weight: 300;
               letter-spacing: 0.5px; color: var(--muted); }

  .notice { border-left: 2px solid var(--data-error); background: var(--surface-soft);
            padding: 16px 20px; font-size: 14px; font-weight: 300; color: var(--body-strong);
            max-width: 980px; }

  /* spec-cell 그리드 */
  .specs { display: grid; gap: 1px; background: var(--hairline);
           grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--hairline); }
  .spec { background: var(--surface-soft); padding: 24px; }
  .spec-val { font-size: 32px; font-weight: 700; line-height: 1; color: var(--on-dark); }
  .spec-sub { margin-top: 4px; font-size: 12px; font-weight: 300; color: var(--muted); }
  .spec-key { margin-top: 12px; font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
              color: var(--body); }
  .spec.total { background: var(--surface-card); }
  .spec-warn { margin-bottom: 16px; border-left: 2px solid var(--data-error);
               background: var(--surface-soft); padding: 12px 16px;
               font-size: 14px; font-weight: 300; color: var(--body-strong); }

  /* 격자 — 이 화면의 주인공 */
  #grids { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
  .dong { margin: 0; }
  table.grid { border-collapse: separate; border-spacing: 2px; }
  table.grid th { font-size: 12px; font-weight: 300; color: var(--muted); padding: 0 2px 4px; }
  table.grid th.type { font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
                       color: var(--body); padding: 0 2px 6px; }
  /* 호수가 아예 없는 자리는 <td> 가 비어 있다 (.cell 요소 자체가 없다).
     청약홈 미등록 = 조합원·임대 물량이라는 의미 있는 정보이므로 td:empty 에 직접 색을 준다. */
  table.grid td:empty { background: var(--cell-idle); }
  .cell { width: 30px; height: 24px; border: 0; border-radius: 0; padding: 0;
          background: var(--cell-idle); cursor: pointer; line-height: 1;
          font-family: inherit; font-size: 11px; font-weight: 700; color: transparent; }
  .cell.info    { background: var(--data-general); color: var(--on-dark); }
  .cell.info.supply-s { background: var(--data-special); }
  .cell.info.supply-g { background: var(--data-general); }
  .cell.empty   { background: var(--data-empty); color: transparent; }
  .cell.error   { background: var(--data-error); color: transparent; }
  .flat { display: flex; flex-wrap: wrap; gap: 2px; }
  .flat .cell { width: 52px; color: var(--on-dark); }

  .legend { flex-basis: 100%; margin-top: 8px; font-size: 12px; font-weight: 400;
            letter-spacing: 0.5px; color: var(--muted); }
  .swatch { display: inline-block; width: 10px; height: 10px; vertical-align: -1px;
            margin: 0 4px 0 16px; }
  .legend .swatch:first-child { margin-left: 0; }

  /* 목록 */
  table.list { border-collapse: collapse; width: 100%; max-width: 820px; }
  table.list th { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hairline);
                  font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); }
  table.list td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hairline);
                  font-size: 14px; font-weight: 300; color: var(--body-strong); }

  .actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 24px; }
  .link { color: var(--on-dark); text-decoration: none; font-size: 14px; font-weight: 700;
          letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px solid var(--on-dark);
          padding-bottom: 2px; }

  /* 상세 — 화면 하단 고정 */
  #detail:not(:empty) { position: sticky; bottom: 0; background: var(--surface-card);
            border-top: 1px solid var(--hairline); padding: 16px 40px;
            max-height: 34vh; overflow-y: auto; margin-top: var(--band); }
  #detail .dt { font-size: 20px; font-weight: 700; color: var(--on-dark); }
  #detail .fields { display: grid; gap: 2px 24px; margin-top: 8px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  #detail .fields div { font-size: 14px; font-weight: 300; color: var(--body-strong); }
  #detail .fields span { display: inline-block; min-width: 116px; font-size: 12px;
            font-weight: 400; letter-spacing: 0.5px; color: var(--muted); }

  footer { margin-top: var(--band); border-top: 1px solid var(--hairline);
           padding: 32px 40px 64px; }

  @media (max-width: 768px) {
    .wrap, #detail:not(:empty), footer { padding-left: 20px; padding-right: 20px; }
    h1 { font-size: 36px; }
    h2 { font-size: 24px; }
    :root { --band: 56px; }
  }
</style>
</head>
<body>

<div class="m-stripe"></div>

<div class="wrap">

<section class="band">
  <h1>청약홈 미계약 세대 스캐너</h1>
  <p class="lead">단지를 고르면 전 동·전 호의 분양권 정보 등록 여부를 한 번에 확인합니다.</p>
</section>

<section class="band">
  <div class="step"><span class="step-no">01</span><span class="step-name">단지 찾기</span></div>
  <form id="search-form" class="row">
    <input id="q" class="input" placeholder="단지명 (예: 상봉 센트럴)" size="26" autofocus>
    <select id="area" class="input">
      <option value="">시도 전체</option>
    </select>
    <button type="submit" class="btn">Search</button>
  </form>
  <div id="results"></div>
  <div id="search-status" class="status" style="margin-top:12px"></div>
  <button id="more" class="btn hide" type="button" style="margin-top:16px">More</button>
</section>

<section class="band">
  <div class="step"><span class="step-no">02</span><span class="step-name">스캔</span></div>
  <div class="row">
    <button id="scan-button" class="btn" disabled>Scan</button>
    <button id="stop-button" class="btn hide">Stop</button>
    <span id="progress" class="status"></span>
    <span id="cache-status" class="caption"></span>
  </div>
</section>

<section class="band hide" id="notice-band">
  <div class="notice" id="notice">
    이 결과는 청약홈에 분양권 정보가 등록되지 않은 세대입니다.
    미계약·부적격 세대일 가능성이 높으나, 사업주체의 등록 지연일 수도 있으므로 참고용으로만 활용하세요.
  </div>
</section>

<section class="band" id="summary-band"><div id="summary"></div></section>
<section class="band"><div id="grids"></div></section>
<section class="band"><div id="empty-list"></div></section>

</div>

<div id="detail"></div>

<footer class="caption">
  청약홈 「분양권 정보(전매제한 등)」 페이지의 공개 데이터를 조회합니다. 참고용으로만 활용하세요.
</footer>

<script type="module">
import {
  formatCheckedAt, resolveUnitRequest, runCacheFirstRefresh, unitKey,
} from "/cache.mjs";

const AREAS = ["강원","경기","경남","경북","광주","대구","대전","부산","서울","세종",
               "울산","인천","전남","전북","제주","충남","충북"];

const el = (id) => document.getElementById(id);
const state = {
  complex: null, meta: null, units: new Map(), aborted: false,
  cache: { status: "disabled", checkedAt: null },
  search: { name: "", area: "", page: 1, loaded: 0, total: 0 },
};

// 주택형 "084.8422A" → 표기 "84A", 전용면적 "84.8422".
// grid.py 의 short_type / net_area 와 같은 규칙이다. 한쪽만 고치면 화면 표기가 어긋난다.
function shortType(houseType) {
  const m = /^0*(\d+)\.\d+(.*)$/.exec(houseType || "");
  return m ? m[1] + m[2] : (houseType || "");
}

function netArea(houseType) {
  const m = /^0*(\d+\.\d+)/.exec(houseType || "");
  return m ? m[1] : "";
}

function fmtArea(value) {
  const n = parseFloat(value);
  return isNaN(n) ? "" : n.toFixed(2) + "㎡";
}

AREAS.forEach((name) => {
  const option = document.createElement("option");
  option.value = option.textContent = name;
  el("area").append(option);
});

el("search-form").addEventListener("submit", (event) => {
  event.preventDefault();
  state.search = {
    name: el("q").value.trim(), area: el("area").value, page: 1, loaded: 0, total: 0,
  };
  el("results").innerHTML = "";
  el("more").classList.add("hide");
  loadPage();
});

el("more").addEventListener("click", () => {
  state.search.page += 1;
  loadPage();
});

async function loadPage() {
  const { name, area, page } = state.search;
  el("search-status").textContent = "검색 중…";
  el("more").disabled = true;
  try {
    const params = new URLSearchParams({ name, area, page: String(page) });
    const response = await fetch("/api/search?" + params);
    const body = await response.json();
    if (!response.ok) throw new Error(body.message || "검색 실패");
    renderResults(body);
  } catch (error) {
    el("search-status").textContent = "검색에 실패했습니다: " + error.message;
  } finally {
    el("more").disabled = false;
  }
}

function renderResults(body) {
  state.search.total = body.total;
  state.search.loaded += body.complexes.length;

  if (!state.search.loaded) {
    el("search-status").textContent = "검색 결과가 없습니다.";
    el("more").classList.add("hide");
    return;
  }
  el("search-status").textContent = `${state.search.loaded}건 표시 (전체 ${body.total}건)`;
  el("more").classList.toggle("hide", state.search.loaded >= body.total);

  body.complexes.forEach((item) => {
    const label = document.createElement("label");
    label.className = "pick";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "complex";
    radio.addEventListener("change", () => {
      document.querySelectorAll(".pick.on").forEach((n) => n.classList.remove("on"));
      label.classList.add("on");
      state.complex = item;
      el("scan-button").disabled = false;
    });

    const name = document.createElement("span");
    name.className = "pick-name";
    name.textContent = item.name;

    const meta = document.createElement("span");
    meta.className = "pick-meta";
    meta.textContent = `공고 ${item.notice_date} · 당첨발표 ${item.winner_date} · ${item.house_manage_no}`;

    label.append(radio, name, meta);
    el("results").append(label);
  });
}

// 청약홈이 공공 사이트라 동시에 이만큼만 부른다.
// 요청이 끝나야 다음이 나가므로, 청약홈이 느려지면 스캔도 자동으로 함께 느려진다.
//
// setTimeout 으로 요청 간격을 두지 않는다. 브라우저는 백그라운드 탭의 타이머를
// 1초로 묶어버려서, 사용자가 다른 탭을 보는 동안 스캔이 네 배 느려진다(실측 15초 → 62초).
// 요청 자체가 0.17초쯤 걸리므로 동시 수 제한만으로 충분히 완만하다.
const CONCURRENCY = 3;

// 작업 목록을 동시 CONCURRENCY 개로 처리한다. 동·호 목록 조회와 세대 조회가 같은 러너를 쓴다.
async function runPool(items, worker) {
  const results = new Array(items.length);
  let next = 0;
  async function loop() {
    while (true) {
      const index = next++;
      if (index >= items.length || state.aborted) return;
      results[index] = await worker(items[index], index);
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, loop));
  return results;
}

async function getJson(path, params) {
  const response = await fetch(path + "?" + new URLSearchParams(params));
  const body = await response.json().catch(() => ({}));
  if (!response.ok && response.status !== 202) {
    throw new Error(body.message || `요청 실패 (${response.status})`);
  }
  return { ...body, http_status: response.status };
}

async function fetchResolvedUnit(hm, pb, job) {
  const previous = state.units.get(unitKey(job.dong, job.ho));
  return resolveUnitRequest({
    job,
    previous,
    loadUnit: () => getJson("/api/unit", { hm, pb, dong: job.dong, ho: job.ho }),
    loadSnapshot: () => getJson("/api/cache", { hm, pb }),
    isAborted: () => state.aborted,
  });
}

async function fetchTopology(hm, pb) {
  const { dongs } = await getJson("/api/dongs", { hm, pb });
  if (!dongs.length) return { total: 0, dongs: [], supply: null };
  const perDong = await runPool(dongs, (dong) =>
    getJson("/api/hos", { hm, pb, sn: dong.sn })
      .then((result) => ({ ...result, name: dong.name }))
  );
  const metaDongs = perDong.filter(Boolean).map((dong) => ({
    name: dong.name, hos: dong.hos, grid: dong.grid,
  }));
  return {
    total: metaDongs.reduce((sum, dong) => sum + dong.hos.length, 0),
    dongs: metaDongs,
    supply: null,
  };
}

function summarize(elapsed = "0.0") {
  const tally = { info: 0, empty: 0, error: 0 };
  state.units.forEach((unit) => {
    tally[unit.status] = (tally[unit.status] || 0) + 1;
  });
  return { total: state.meta?.total || 0, ...tally, elapsed };
}

function renderStoredSnapshot(snapshot) {
  renderCacheStatus(snapshot);
  onMeta(state.meta);
  state.units.forEach(onUnit);
  onDone(summarize());
  const checked = formatCheckedAt(snapshot.checked_at);
  el("progress").textContent = checked
    ? `저장된 결과 ${state.units.size} / ${state.meta.total} · 마지막 확인 ${checked}`
    : `저장된 결과 ${state.units.size} / ${state.meta.total}`;
}

function renderCacheStatus(snapshot) {
  const labels = {
    disabled: "공유 캐시 없이 직접 조회",
    miss: "저장된 결과 없음",
    partial: "일부 데이터만 저장됨",
    fresh: "저장된 결과",
    stale: "저장된 결과 · 업데이트 필요",
  };
  const checked = formatCheckedAt(snapshot.checked_at);
  el("cache-status").textContent =
    `${labels[snapshot.cache] || ""}${checked ? ` · ${checked}` : ""}`;
}

async function scanComplex({ forceFull = false } = {}) {
  if (!state.complex) return;
  state.meta = null;
  state.units = new Map();
  state.aborted = false;
  el("grids").innerHTML = "";
  el("summary").innerHTML = "";
  el("empty-list").innerHTML = "";
  el("detail").innerHTML = "";
  el("notice-band").classList.add("hide");
  el("cache-status").textContent = "";
  el("scan-button").disabled = true;
  el("stop-button").classList.remove("hide");

  const hm = state.complex.house_manage_no;
  const pb = state.complex.pblanc_no;
  const started = Date.now();
  try {
    const result = await runCacheFirstRefresh({
      state,
      forceFull,
      loadSnapshot: async () => {
        const snapshot = await getJson("/api/cache", {
          hm, pb, ...(forceFull ? { refresh: "full" } : {}),
        });
        renderCacheStatus(snapshot);
        return snapshot;
      },
      fetchTopology: () => fetchTopology(hm, pb),
      fetchSupply: () => getJson("/api/pblanc", { hm, pb })
        .then((body) => body.supply).catch(() => null),
      fetchUnit: (job) => fetchResolvedUnit(hm, pb, job),
      runJobs: runPool,
      onStored: renderStoredSnapshot,
      onTopology: () => {
        el("grids").innerHTML = "";
        onMeta(state.meta);
        state.units.forEach(onUnit);
      },
      onUnit,
      onProgress: ({ updated, total }) => {
        el("progress").textContent =
          `저장된 결과 ${state.units.size} / ${state.meta.total} · 업데이트 ${updated} / ${total}`;
      },
    });
    renderCacheStatus(result.snapshot);

    if (result.status === "blocked") {
      el("progress").textContent =
        `다른 방문자가 업데이트 중입니다 · ${result.snapshot.full_refresh.retry_after}초 뒤 전체 새로고침 가능`;
      return;
    }
    if (result.status === "fresh") return;
    if (result.status === "aborted") {
      el("progress").textContent = `중단됨 · ${state.units.size}세대까지 저장`;
      return;
    }
    if (result.status === "empty") {
      el("progress").textContent = "이 단지는 아직 분양권 정보가 등록되지 않았습니다.";
      return;
    }
    const summary = summarize(((Date.now() - started) / 1000).toFixed(1));
    el("progress").textContent =
      `완료 · ${summary.total}세대 중 정보없음 ${summary.empty}건` +
      (summary.error ? ` · 실패 ${summary.error}건` : "") +
      ` (${summary.elapsed}초)`;
    onDone(summary);
  } catch (error) {
    el("progress").textContent = error.message;
  } finally {
    finishScan();
  }
}

el("scan-button").addEventListener("click", () => scanComplex());

el("stop-button").addEventListener("click", () => {
  state.aborted = true;
  el("progress").textContent = `중단하는 중… (${state.units.size}세대까지 조회)`;
});

function finishScan() {
  el("scan-button").disabled = false;
  el("stop-button").classList.add("hide");
}

function cellId(dong, ho) { return `c-${dong}-${ho}`; }

function makeCell(dong, ho) {
  const button = document.createElement("button");
  button.className = "cell";
  button.id = cellId(dong, ho);
  button.title = `${dong}동 ${ho}호`;
  button.addEventListener("click", () => showDetail(dong, ho));
  return button;
}

function onMeta(meta) {
  el("notice-band").classList.remove("hide");
  const container = el("grids");
  meta.dongs.forEach((dong) => {
    const box = document.createElement("div");
    box.className = "dong";
    const title = document.createElement("h3");
    title.textContent = `${dong.name}동 · ${dong.hos.length}세대`;
    box.append(title);
    box.append(dong.grid ? buildGridTable(dong) : buildFlatList(dong));
    container.append(box);
  });
}

function buildGridTable(dong) {
  const table = document.createElement("table");
  table.className = "grid";
  const head = table.insertRow();
  head.append(document.createElement("th"));   // 층 라벨 칸 자리
  dong.grid.lines.forEach((line) => {
    const th = document.createElement("th");
    th.textContent = line;
    head.append(th);
  });

  // 타입 행. 스캔이 끝나야 값이 차므로 자리만 만들어 두고 refreshTypeHeaders 가 채운다.
  const typeRow = table.insertRow();
  typeRow.append(document.createElement("th"));
  dong.grid.lines.forEach((line) => {
    const th = document.createElement("th");
    th.className = "type";
    th.dataset.dong = dong.name;
    th.dataset.line = line;
    typeRow.append(th);
  });

  const byFloor = new Map();
  Object.entries(dong.grid.cells).forEach(([ho, [floor, line]]) => {
    if (!byFloor.has(floor)) byFloor.set(floor, new Map());
    byFloor.get(floor).set(line, ho);
  });
  dong.grid.floors.forEach((floor) => {
    const row = table.insertRow();
    const th = document.createElement("th");
    th.textContent = floor + "F";
    th.style.textAlign = "right";
    row.append(th);
    dong.grid.lines.forEach((line) => {
      const cell = row.insertCell();
      const ho = byFloor.get(floor)?.get(line);
      if (ho) cell.append(makeCell(dong.name, ho));
    });
  });
  return table;
}

function refreshTypeHeaders() {
  const cache = new Map();
  document.querySelectorAll("th.type").forEach((th) => {
    const dong = th.dataset.dong;
    if (!cache.has(dong)) cache.set(dong, lineTypes(dong));
    const type = cache.get(dong).get(th.dataset.line);
    th.textContent = type ? (type === "혼합" ? "혼합" : shortType(type)) : "";
  });
}

function buildFlatList(dong) {
  const box = document.createElement("div");
  box.className = "flat";
  dong.hos.forEach((ho) => box.append(makeCell(dong.name, ho)));
  return box;
}

const SUPPLY_MARK = { "특별공급": "특", "일반공급": "일" };
const SUPPLY_CLASS = { "특별공급": "supply-s", "일반공급": "supply-g" };

function onUnit(unit) {
  const cell = document.getElementById(cellId(unit.dong, unit.ho));
  if (!cell) return;
  cell.classList.remove("error", "empty", "info", "supply-s", "supply-g");
  cell.classList.add(unit.status);

  const type = unit.fields["주택형"] || "";
  const supply = unit.fields["공급유형"] || "";
  // 미계약·실패 세대에는 공급유형이 없다. 청약홈이 값을 주지 않으므로 글자와 색을 비운다.
  cell.textContent = SUPPLY_MARK[supply] || "";
  if (SUPPLY_CLASS[supply]) cell.classList.add(SUPPLY_CLASS[supply]);
  cell.title =
    `${unit.dong}동 ${unit.ho}호` +
    (type ? ` · ${shortType(type)}` : "") +
    (supply ? ` · ${supply}` : "");
}

// 라인(호수 끝 두 자리)마다 주택형을 모은다. 한 라인에 두 타입이 섞이면 "혼합".
// 정보있음 세대의 주택형에서 역산하므로 스캔이 진행되며 채워진다.
function lineTypes(dongName) {
  const found = new Map();
  for (const unit of state.units.values()) {
    if (unit.dong !== dongName || unit.status !== "info") continue;
    const type = unit.fields["주택형"];
    if (!type || unit.ho.length < 3) continue;
    const line = unit.ho.slice(-2);
    const seen = found.get(line);
    if (seen === undefined) found.set(line, type);
    else if (seen !== type) found.set(line, "혼합");
  }
  return found;
}

// 세대를 타입별로 모은다. 미계약 세대는 주택형이 없으므로 같은 라인의 타입을 빌려 채운다.
function tallyByType() {
  const byDong = new Map();
  const tally = new Map();   // 주택형 → {scanned, empty}
  for (const unit of state.units.values()) {
    if (!byDong.has(unit.dong)) byDong.set(unit.dong, lineTypes(unit.dong));
    const type =
      unit.fields["주택형"] ||
      (unit.ho.length >= 3 ? byDong.get(unit.dong).get(unit.ho.slice(-2)) : "");
    if (!type || type === "혼합") continue;
    if (!tally.has(type)) tally.set(type, { scanned: 0, empty: 0 });
    const row = tally.get(type);
    row.scanned += 1;
    if (unit.status === "empty") row.empty += 1;
  }
  return tally;
}

function onDone(summary) {
  refreshTypeHeaders();
  renderSummary();
  renderLegend(summary);
  renderEmptyList();
  renderActions(summary);
}

function renderSummary() {
  const tally = tallyByType();
  if (!tally.size) { el("summary").innerHTML = ""; return; }

  const supply = state.meta?.supply || null;
  const byType = new Map((supply || []).map((s) => [s.type, s]));

  // 공고에는 있는데 스캔에 안 잡힌 타입도 표에 남긴다
  const types = new Set([...tally.keys(), ...byType.keys()]);
  const sorted = [...types].sort((a, b) => {
    const d = parseFloat(netArea(a)) - parseFloat(netArea(b));
    return d !== 0 ? d : shortType(a).localeCompare(shortType(b));
  });

  const warnings = [];
  const cells = sorted.map((type) => {
    const t = tally.get(type) || { scanned: 0, empty: 0 };
    const s = byType.get(type);
    if (s && s.total !== t.scanned) {
      warnings.push(`${shortType(type)} 공고 ${s.total} / 스캔 ${t.scanned}`);
    }
    const base = s ? s.total : t.scanned;
    const rate = base ? ((t.empty / base) * 100).toFixed(1) + "%" : "-";
    // 공고에 있는 타입은 서버가 계산해 보낸 값을, 스캔에서만 나온 타입은 여기서 계산한다
    const label = s ? s.short : shortType(type);
    const net = s ? s.net_area : netArea(type);
    return `<div class="spec">
      <div class="spec-val">${t.empty}</div>
      <div class="spec-sub">${base}세대 중 · ${rate}</div>
      <div class="spec-key">${label}</div>
      <div class="spec-sub">전용 ${fmtArea(net)}${s ? ` · 일반 ${s.general} / 특별 ${s.special}` : ""}</div>
    </div>`;
  });

  const totalEmpty = [...tally.values()].reduce((sum, t) => sum + t.empty, 0);
  const totalScanned = [...tally.values()].reduce((sum, t) => sum + t.scanned, 0);
  const totalSupply = supply ? supply.reduce((sum, s) => sum + s.total, 0) : totalScanned;
  const totalGeneral = supply ? supply.reduce((sum, s) => sum + s.general, 0) : 0;
  const totalSpecial = supply ? supply.reduce((sum, s) => sum + s.special, 0) : 0;
  const totalRate = totalSupply ? ((totalEmpty / totalSupply) * 100).toFixed(1) + "%" : "-";

  cells.push(`<div class="spec total">
      <div class="spec-val">${totalEmpty}</div>
      <div class="spec-sub">${totalSupply}세대 중 · ${totalRate}</div>
      <div class="spec-key">합계</div>
      <div class="spec-sub">${supply ? `일반 ${totalGeneral} / 특별 ${totalSpecial}` : "공고 대조 불가"}</div>
    </div>`);

  const warnHtml = warnings.length
    ? `<div class="spec-warn">${warnings.join(" · ")} — 라인과 타입의 대응이 단순하지 않은 단지일 수 있어
       타입별 집계가 정확하지 않을 수 있습니다.</div>`
    : "";

  el("summary").innerHTML =
    `<h2>타입별 미계약 현황</h2>` +
    `<div class="caption" style="margin:-16px 0 16px">${supply ? "공고 기준" : "공고 대조 불가 · 스캔 기준"}</div>` +
    warnHtml +
    `<div class="specs">${cells.join("")}</div>`;
}

const CSV_HEADER = [
  "동", "호", "타입", "판정", "주택형", "공급유형", "공고일",
  "당첨자 발표일", "계약체결일", "입주예정", "전매제한", "분양금액(만원)",
];
const STATUS_LABEL = { info: "정보있음", empty: "정보없음", error: "조회실패" };

function csvCell(value) {
  const text = String(value ?? "");
  return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function buildCsv() {
  const lines = [CSV_HEADER.join(",")];
  for (const unit of state.units.values()) {
    const f = unit.fields || {};
    const houseType = f["주택형"] || "";
    lines.push([
      unit.dong, unit.ho,
      houseType ? shortType(houseType) : "",
      STATUS_LABEL[unit.status] || unit.status,
      ...CSV_HEADER.slice(4).map((key) => f[key] || ""),
    ].map(csvCell).join(","));
  }
  // 엑셀에서 바로 열리도록 UTF-8 BOM 을 붙인다
  return "﻿" + lines.join("\n") + "\n";
}

function downloadCsv() {
  const blob = new Blob([buildCsv()], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${state.complex ? state.complex.name : "scan"}.csv`;
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderActions(summary) {
  const bar = document.createElement("div");
  bar.className = "actions";

  const button = document.createElement("button");
  button.className = "btn";
  button.textContent = "CSV Download";
  button.addEventListener("click", downloadCsv);
  bar.append(button);

  const refresh = document.createElement("button");
  refresh.className = "btn";
  refresh.textContent = "전체 새로고침";
  refresh.addEventListener("click", () => scanComplex({ forceFull: true }));
  bar.append(refresh);

  el("empty-list").prepend(bar);
  if (summary.error) renderRetry(summary, bar);
}

function renderRetry(summary, bar) {
  const button = document.createElement("button");
  button.className = "btn";
  button.textContent = `Retry ${summary.error}`;
  button.addEventListener("click", async () => {
    button.disabled = true;
    button.textContent = "Retrying…";
    await retryFailedUnits(summary);
  });
  bar.append(button);
}

async function retryFailedUnits(summary) {
  const failed = [...state.units.values()].filter((unit) => unit.status === "error");
  for (const unit of failed) {
    try {
      const fresh = await fetchResolvedUnit(
        state.complex.house_manage_no,
        state.complex.pblanc_no,
        unit,
      );
      if (!fresh || state.aborted) continue;
      state.units.set(unitKey(fresh.dong, fresh.ho), fresh);
      onUnit(fresh);
    } catch (error) {
      // 이 세대는 그대로 두고 다음으로 넘어간다
    }
  }
  const updated = summarize(summary.elapsed);
  onDone(updated);
  return updated;
}

function renderLegend(summary) {
  document.querySelectorAll(".legend").forEach((node) => node.remove());

  let special = 0, general = 0, unknown = 0;
  state.units.forEach((unit) => {
    if (unit.status !== "info") return;
    const supply = unit.fields["공급유형"];
    if (supply === "특별공급") special += 1;
    else if (supply === "일반공급") general += 1;
    else unknown += 1;
  });

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML =
    `<span class="swatch" style="background:var(--data-special)"></span>특별공급 ${special}` +
    `<span class="swatch" style="background:var(--data-general)"></span>일반공급 ${general}` +
    (unknown ? `<span class="swatch" style="background:var(--data-general)"></span>유형미상 ${unknown}` : "") +
    `<span class="swatch" style="background:var(--data-empty)"></span>정보없음 ${summary.empty}` +
    (summary.error ? `<span class="swatch" style="background:var(--data-error)"></span>조회실패 ${summary.error}` : "") +
    `<span class="swatch" style="background:var(--cell-idle)"></span>청약홈 미등록 (조합원·임대 등)` +
    `<br>색과 글자(특·일)는 그 세대 당첨자의 청약 유형입니다`;
  el("grids").append(legend);
}

// 정보없음 응답에는 값이 하나도 실려 오지 않는다 (라벨만 있고 주택형·공급유형 칸이 비어 있다).
// 그래서 같은 동·같은 라인의 정보있음 세대에서 타입을 빌려와 참고값으로 보여준다.
function renderEmptyList() {
  const empties = [...state.units.values()]
    .filter((unit) => unit.status === "empty")
    .sort((a, b) => a.dong.localeCompare(b.dong) || Number(a.ho) - Number(b.ho));

  if (!empties.length) {
    el("empty-list").innerHTML =
      `<h2>정보없음 0세대</h2><p class="status">모든 세대에 분양권 정보가 등록되어 있습니다.</p>`;
    return;
  }
  const byDong = new Map();
  const rows = empties
    .map((unit) => {
      if (!byDong.has(unit.dong)) byDong.set(unit.dong, lineTypes(unit.dong));
      const type = unit.ho.length >= 3 ? byDong.get(unit.dong).get(unit.ho.slice(-2)) || "" : "";
      const shown = type && type !== "혼합" ? shortType(type) : type;
      return `<tr><td>${unit.dong}</td><td>${unit.ho}</td><td>${shown}</td>` +
             `<td>${type && type !== "혼합" ? fmtArea(netArea(type)) : ""}</td></tr>`;
    })
    .join("");
  el("empty-list").innerHTML =
    `<h2>정보없음 ${empties.length}세대</h2>` +
    `<table class="list"><thead><tr><th>동</th><th>호</th><th>타입</th><th>전용</th></tr></thead>` +
    `<tbody>${rows}</tbody></table>`;
}

function showDetail(dong, ho) {
  const unit = state.units.get(unitKey(dong, ho));
  if (!unit) return;
  if (unit.status !== "info") {
    if (unit.status !== "empty") {
      el("detail").innerHTML =
        `<div class="dt">${dong}동 ${ho}호</div><div class="caption">조회 실패</div>`;
      return;
    }
    const type = unit.ho.length >= 3 ? lineTypes(dong).get(ho.slice(-2)) || "" : "";
    const s = (state.meta?.supply || []).find((x) => x.type === type);
    const parts = [];
    if (type && type !== "혼합") {
      parts.push(`${shortType(type)} · 전용 ${fmtArea(netArea(type))}`);
    }
    if (s) parts.push(`공고 ${s.total}세대 (일반 ${s.general} / 특별 ${s.special})`);
    el("detail").innerHTML =
      `<div class="dt">${dong}동 ${ho}호</div>` +
      `<div class="caption">정보없음 · 미계약·부적격 추정${parts.length ? " · " + parts.join(" · ") : ""}</div>`;
    return;
  }
  const rows = Object.entries(unit.fields)
    .map(([key, value]) => `<div><span>${key}</span>${value || "-"}</div>`)
    .join("");
  el("detail").innerHTML = `<div class="dt">${dong}동 ${ho}호</div><div class="fields">${rows}</div>`;
}
</script>
</body>
</html>
